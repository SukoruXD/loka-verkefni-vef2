            <input type="email" id="netfang" required placeholder="Netfang">

            <label for="skilabod">Skilaboð</label>

            <div class="grid">
                <div>
                    <label for="valkostur">hefur þú spilað Bloons TD leiki?</label>
                    <label for="radio1">
                        <input type="radio" id="radio1" name="radiobtn" checked>
                        Já
                    </label>
                    <label for="radio2">
                        <input type="radio" id="radio2" name="radiobtn">
                        Nei
                    </label>
                </div>
                <div>
                    <label for="selects">Hvaða Leik?</label>
                    <select id="selects">
                        <option>Bloons TD 6</option>
                        <option>Bloons Battles leikina</option>
                        <option>Bloons TD 5</option>
                    </select>
                </div>
            </div>
            <input type="submit" value="Senda">
        </form>
        <div class="animated-line">

        </div>
        
        <footer>

    </main>
    <dialog id="skraning">
        <article>
            <header>
                <button aria-label="Close" rel="prev" id="dialogClose"></button>
                <p>Sláðu inn username og pasword</p>
            </header>
            <form action="admin.html" method="get">
                <label for="user">Notandi</label>
                <input type="text" id="user" placeholder="User" required>

                <label for="pass">Password</label>
                <input type="text" id="pass" placeholder="Password" required>

                <input type="submit" placeholder="Skrá inn">
            </form>
        </article>
    </dialog>

    <script>

        const openbutton = document.getElementById("dialogOpen")
        const closebutton = document.getElementById("dialogClose")
        const dialog = document.getElementById("skraning")

        openbutton.addEventListener("click", function(){
            dialog.showModal();
        });

        closebutton.addEventListener("click", function(){
            dialog.close();
        });

    </script>
